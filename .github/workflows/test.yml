name: test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Check adapter sync (SKILL.md vs. AGENTS.md/.cursor/.windsurf/.qoder/...)
        run: python scripts/check_adapters.py

      - name: Run test suite (includes plugin-manifest JSON validation)
        run: python -m pytest tests/ -v

      - name: Install and test instinct-mcp
        working-directory: instinct-mcp
        run: |
          npm install
          npm test
