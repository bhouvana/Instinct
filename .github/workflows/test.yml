name: test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Check adapter sync (SKILL.md vs. AGENTS.md/.cursor/.windsurf/.qoder/...)
        run: python scripts/check_adapters.py

      - name: Check version consistency across host manifests
        run: python scripts/check_versions.py

      - name: Run test suite (includes plugin-manifest JSON validation)
        run: python -m pytest tests/ -v

      - name: Install and test instinct-mcp
        working-directory: instinct-mcp
        run: |
          npm install
          npm test

      - name: Test pi-extension
        working-directory: pi-extension
        run: npm test

      - name: Judgment regression suite (RFC-0004/0005 corpus vs. a real model)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY secret configured — skipping the real"
            echo "judgment-regression pass against eval/corpus/. This is"
            echo "expected until a key is added (see docs/ROADMAP.md); the"
            echo "stub-backend harness plumbing is still covered by pytest."
            exit 0
          fi
          pip install anthropic
          python eval/run.py --backend api --samples 3
