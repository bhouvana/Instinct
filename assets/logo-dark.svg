    <line x1="106" y1="60" x2="126" y2="60"/>
  </g>
  <g stroke="#f2f2f2" stroke-width="3">
    <rect x="12" y="46" width="28" height="28" transform="rotate(45 26 60)" fill="none"/>
    <rect x="72" y="46" width="28" height="28" transform="rotate(45 86 60)" fill="none"/>
    <rect x="132" y="46" width="28" height="28" transform="rotate(45 146 60)" fill="#f2f2f2"/>
  </g>
  <text x="196" y="76" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="52" letter-spacing="-1" fill="#f2f2f2">Instinct</text>
